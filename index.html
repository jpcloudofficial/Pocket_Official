function showText(title,txt,restore){ov(`<h3>${title}</h3><small>${restore?'Paste a backup below, then restore.':'Select all and copy this text.'}</small>${restore?'<input type="file" accept=".json,application/json" onchange="rf(this)" style="margin-top:8px">':''}<textarea id="ta" rows="10" style="margin-top:8px"${restore?'':' readonly'}>${esc(txt)}</textarea><p class="er" id="er"></p><div class="row end"><button class="b2" onclick="cl()">Close</button>${restore?'':`<button class="b2" onclick="dl('${title==='Backup'?'pocket-backup-'+today()+'.json':'pocket-'+today()+'.csv'}',$('#ta').value,'${title==='Backup'?'application/json':'text/csv'}')">Download</button>`}<button class="b1" onclick="${restore?'doRestore()':'cp()'}">${restore?'Restore':'Copy'}</button></div>`)}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}const rf=i=>{const f=i.files[0];if(f)f.text().then(t=>{$('#ta').value=t})};function cp(){const t=$('#ta');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}$('#er').style.color='var(--in)';$('#er').textContent='Copied'}
function doRestore(){let d;try{d=clean(JSON.parse($('#ta').value))}catch(e){}if(!d)return $('#er').textContent='That doesn’t look like a valid Pocket backup.';ask('Replace all your current data with this backup?',()=>{D=d},'Restore')}
